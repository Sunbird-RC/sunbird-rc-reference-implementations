# The Authority Service's PUBLIC trust surface. Exactly two routes.
#
# A verifier holding a credential has no tenant and no membership, so the two questions it
# needs answered cannot require authentication:
#
#   GET /trust/issuers/{issuerId}                 who is this issuer, and which keys are
#                                                 theirs
#   GET /trust/credentials/{credentialId}/status  is this credential still to be relied on
#
# Both are marked @Public() in the service and sanitised there: the issuer route returns a
# DID, a display name and verification methods; the status route returns a credential id, a
# status and an effective time. Neither exposes a tenant or Authority relationship, a
# profile, a record, an internal hostname or a KMS reference.
#
# WHAT THIS FILE DELIBERATELY DOES NOT DO is proxy the Authority Service generally. There is
# no `location /api/v1/` here and there must not be. The administrative API — tenants,
# authorities, registry bindings, records, credential profiles, claim mappings, issuance,
# revocation — is published on 127.0.0.1:3334 and is reachable through no listener in this
# gateway. A single prefix location would undo that in one line, which is why these two are
# matched exactly rather than by prefix.
#
# Included by the internet-facing server blocks only. The operator listener reaches the
# Authority directly and has no need of it.

# One regex, anchored, admitting only the two shapes above. `[^/]+` keeps the match to a
# single path segment, so nothing can be appended to reach a third route.
#
# $request_uri, not $uri: a credential id is a DID (did:rcw:<uuid>) and arrives
# percent-encoded. $uri is decoded, and passing the decoded form upstream turns the colons
# into path text the service will not match. The raw request line is forwarded as it came.
location ~ ^/trust/(issuers/[^/]+|credentials/[^/]+/status)$ {
    set $authority http://authority-service:3334;
    proxy_pass $authority/api/v1$request_uri;

    # Read-only routes. Anything else aimed at them is a mistake or a probe, and the
    # service should not have to decide which.
    limit_except GET { deny all; }

    # The service sets its own Cache-Control — five minutes for issuer metadata, sixty
    # seconds for status, because a stale "ACTIVE" is the one answer that must not last.
    # Nothing here overrides that.
    proxy_pass_header Cache-Control;
}
