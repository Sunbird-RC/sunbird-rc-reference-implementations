# Operator routes — NEVER exposed to the internet
#
# The demo stack deliberately ships unauthenticated operator endpoints: the
# registry API (read AND write), DID minting, schema creation, the
# pre-authorised offer endpoint the scripted tests use, and Keycloak's admin
# console. They are how bootstrap.sh, the seed script and the test suites do
# their work.
#
# They are served ONLY on the operator listener, which Docker publishes on
# 127.0.0.1 — so they are unreachable from another machine no matter what its
# address is. An earlier attempt allowlisted source addresses instead; it
# failed on macOS, where Docker Desktop's host-to-container NAT arrives from an
# unpredictable public-looking address, and it meant recording an operator's
# address in deployment config. A listener that is simply not on the public
# interface needs neither.
#
# To reach these from another machine, forward the port over ssh:
#   ssh -L 8088:127.0.0.1:8088 user@host
# Included by every server block that serves it. See nginx.conf (plain HTTP),
# nginx-tls.conf (HTTPS) and the operator listener in both.

location /api/issuer/ {
    set $up http://age-issuer:4200;
    rewrite ^/api/issuer/(.*)$ /$1 break;
    proxy_pass $up;
}
# --- Keycloak -------------------------------------------------------------
# Must be reachable by the BROWSER at the same origin the issuer advertises,
# or the wallet's login redirect lands somewhere it cannot return from.
location /auth/admin {
    set $up http://keycloak:8080;
    proxy_pass $up;
}
# --- identity-service: DID documents and key utilities -------------------
location /did {
    set $up http://identity:3332;
    proxy_pass $up;
}
location /utils {
    set $up http://identity:3332;
    proxy_pass $up;
}
# --- schema + credential services (bootstrap and debugging) --------------
location /credential-schema {
    set $up http://credential-schema:3333;
    proxy_pass $up;
}
location /credentials {
    set $up http://credential:3000;
    proxy_pass $up;
}
# --- registry (seeding and debugging) ------------------------------------
# An explicit `rewrite` is required, not a trailing slash on proxy_pass:
# when proxy_pass contains a VARIABLE, nginx forwards the original URI
# unchanged and the usual prefix-stripping does not happen. `set` must come
# BEFORE `rewrite ... break` — both are rewrite-module directives and
# `break` ends that phase, leaving $up empty and nginx answering 500.
location /registry/ {
    set $up http://registry:8081;
    rewrite ^/registry/(.*)$ /$1 break;
    proxy_pass $up;
}
location /api/v1 {
    set $up http://registry:8081;
    proxy_pass $up;
}

# --- issuer- and verifier-side protocol endpoints -------------------------
# These sit under wallet-facing prefixes but are NOT wallet endpoints:
#
#   POST /oid4vc/offer  mints a credential offer from caller-supplied claims —
#                       public, it would let anyone obtain a credential signed by
#                       the National Identity Authority saying anything at all
#   POST /vp/request    starts a presentation request (the verifier's side)
#   GET  /vp/status/:id returns the DISCLOSED claims of a presentation, so it is
#                       also a privacy leak, not just an integrity one
#
# `=` matches exactly, so the wallet's own GET /oid4vc/offer/:id and
# GET /vp/request-object/:id still reach the public prefixes.
location = /oid4vc/offer {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}
location = /vp/request {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}
location /vp/status {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}
