# Plain-HTTP gateway.
#
# Two listeners, and the difference between them is the whole point:
#
#   :80    what the internet sees — citizen and wallet routes only
#   :8088  the operator listener, published on 127.0.0.1 only, which ALSO serves
#          the unauthenticated operator endpoints bootstrap.sh and the tests use
#
# `resolver` plus a variable in proxy_pass is used throughout (see
# routes-citizen.conf) so nginx re-resolves container names per request.
server {
    listen 80;
    server_name _;

    include /etc/nginx/routes-citizen.conf;
    include /etc/nginx/routes-denied.conf;
}

server {
    listen 8088;
    server_name _;

    include /etc/nginx/routes-citizen.conf;
    include /etc/nginx/routes-ops.conf;
}
