# Routes a citizen's wallet and the verifier page need
#
# Public by design: this is the demo. Everything here is either read-only
# metadata, a protocol endpoint that authenticates its own caller, or the
# verifier page.
# Included by every server block that serves it. See nginx.conf (plain HTTP),
# nginx-tls.conf (HTTPS) and the operator listener in both.

resolver 127.0.0.11 valid=10s ipv6=off;

# Generous, because amd64 emulation makes the Java registry slow to answer.
proxy_connect_timeout 30s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# --- the verifier experience ---------------------------------------------
# Static page; no build step. The browser only ever talks to /api/verifier,
# never to oid4vc-service directly — the APPROVED/DENIED decision is made
# server-side, so it cannot be a UI-only simulation.

# --- the verifier experience ---------------------------------------------
# Static page; no build step. The browser only ever talks to /api/verifier,
# never to oid4vc-service directly — the APPROVED/DENIED decision is made
# server-side, so it cannot be a UI-only simulation.
location = /verifier { return 301 /verifier/; }
location /verifier/ {
    alias /usr/share/nginx/html/verifier/;
    index index.html;
    add_header Cache-Control "no-store";
}

location /api/verifier/ {
    set $up http://verifier:4300;
    rewrite ^/api/verifier/(.*)$ /$1 break;
    proxy_pass $up;
}

# No /issuer/ page. The revised charter requires issuance to be initiated
# and completed inside the wallet: "Do not use a QR code for issuance. Do
# not require an issuer-counter web page to start issuance." The page that
# used to live here rendered an issuance QR, which the review rejected.

# Stylesheet and font, shared by the pages that remain.
location /assets/ {
    alias /usr/share/nginx/html/assets/;
    add_header Cache-Control "no-store";
}

location /auth {
    set $up http://keycloak:8080;
    proxy_pass $up;
}

# The redirect target the wallet registers with the authorization server
# (apps/wallet/app.config.js -> allowedRedirectBaseUrls[0]). The wallet
# intercepts this path itself via its App Link handler; serving a page here
# only matters when the interception does not happen, so make the failure
# legible instead of a 404.
location = /wallet/redirect {
    default_type text/html;
    return 200 '<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Return to the wallet</title><body style="font:16px system-ui;padding:2rem;max-width:32rem"><h1>Sign-in complete</h1><p>If the wallet did not reopen automatically, switch back to it manually — the authorization code is in this page URL and the wallet reads it from there.</p></body>';
}

# --- OID4VCI / OID4VP wallet-facing endpoints ----------------------------
location /oid4vc {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

location /vp {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

location /vct {
    # A wallet that revalidates gets 304 with NO BODY, and a DID document or a
    # credential-type document that arrives empty fails verification with nothing
    # more useful than "something went wrong" on the phone. Both documents are
    # small and change only when the stack is re-bootstrapped, so caching them
    # buys nothing and costs correctness: strip the conditional request so the
    # upstream always answers 200, and tell the client not to store it.
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    add_header Cache-Control "no-store" always;
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

location /contexts {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

location /render-templates {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

location /qr {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

location = /.well-known/openid-credential-issuer {
    set $up http://oid4vc-service:3400;
    proxy_pass $up/.well-known/openid-credential-issuer;
}

location = /.well-known/openid-configuration {
    set $up http://oid4vc-service:3400;
    proxy_pass $up/.well-known/openid-configuration;
}

location = /.well-known/oauth-authorization-server {
    set $up http://oid4vc-service:3400;
    proxy_pass $up/.well-known/oauth-authorization-server;
}

location = /.well-known/jwks.json {
    set $up http://oid4vc-service:3400;
    proxy_pass $up/.well-known/jwks.json;
}

location /.well-known/vct {
    set $up http://oid4vc-service:3400;
    proxy_pass $up;
}

# did:web documents live at /<uuid>/did.json. The `{36}` MUST sit inside a
# quoted regex — unquoted, nginx reads the brace as a block and refuses to
# start.
location ~ "^/[0-9a-fA-F-]{36}/did\.json$" {
    # A wallet that revalidates gets 304 with NO BODY, and a DID document or a
    # credential-type document that arrives empty fails verification with nothing
    # more useful than "something went wrong" on the phone. Both documents are
    # small and change only when the stack is re-bootstrapped, so caching them
    # buys nothing and costs correctness: strip the conditional request so the
    # upstream always answers 200, and tell the client not to store it.
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    add_header Cache-Control "no-store" always;
    set $up http://identity:3332;
    proxy_pass $up;
}

# --- health probes -------------------------------------------------------
# Distinct prefixes per backend: they all serve /health, so the gateway
# needs a unique path for each to be reachable.
location = /gateway-health {
    default_type text/plain;
    return 200 "ok\n";
}

location = /health {
    set $up http://oid4vc-service:3400;
    proxy_pass $up/health;
}

location = /identity-health {
    set $up http://identity:3332;
    proxy_pass $up/health;
}

location = /schema-health {
    set $up http://credential-schema:3333;
    proxy_pass $up/health;
}

location = /credential-health {
    set $up http://credential:3000;
    proxy_pass $up/health;
}

location = /registry-health {
    set $up http://registry:8081;
    proxy_pass $up/health;
}

location = /issuer-health {
    set $up http://age-issuer:4200;
    proxy_pass $up/healthz;
}

location = /verifier-health {
    set $up http://verifier:4300;
    proxy_pass $up/healthz;
}

location = / { return 302 /verifier/; }
