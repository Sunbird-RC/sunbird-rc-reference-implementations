# Refusals for the public listeners.
#
# Included ONLY by the internet-facing server blocks. Each of these paths sits
# under a wallet-facing prefix, so leaving it out of routes-citizen.conf would
# not be enough — the broader prefix would still serve it. It has to be refused
# explicitly here and proxied for real in routes-ops.conf, which is why the two
# lists live in different files: nginx rejects a duplicate location.
# Keycloak's admin console. The citizen-facing realm endpoints under /auth stay
# public — this longer prefix wins for the console, which would otherwise be
# served by that prefix and answer with a login page.
location /auth/admin      { return 403; }
location = /oid4vc/offer { return 403; }
location = /vp/request   { return 403; }
location /vp/status      { return 403; }
# The Agriculture issuers are published under path prefixes, so their operator
# endpoints inherit those prefixes and need refusing separately — the /farmer/
# and /land/ locations in routes-citizen.conf would otherwise serve
# unauthenticated offer creation with caller-supplied claims to the internet,
# which is precisely what REQUIREMENTS §8 forbids. Exact-match locations beat
# the prefix, and routes-ops.conf proxies them for real on the loopback listener.
location = /farmer/oid4vc/offer { return 403; }
location = /land/oid4vc/offer   { return 403; }
# The bank's signer sits under its own prefix, so its creation and status
# endpoints inherit that prefix and need refusing separately — exactly as the two
# Agriculture issuers do. Creating a presentation request is the verifier
# service's business, never the internet's.
location = /bank-vp/vp/request { return 403; }
location /bank-vp/vp/status     { return 403; }
# The three Education issuers, for the same reason as the two Agriculture ones:
# each is published under a path prefix, so its operator endpoint inherits that
# prefix and unauthenticated offer creation with caller-supplied claims would
# otherwise be reachable from the internet.
# The two Education verifiers' signers, same as the bank's: creating a
# presentation request is the verifier service's business, never the internet's.
location = /university-vp/vp/request { return 403; }
location /university-vp/vp/status     { return 403; }
location = /employer-vp/vp/request   { return 403; }
location /employer-vp/vp/status       { return 403; }
location = /school/oid4vc/offer     { return 403; }
location = /college/oid4vc/offer    { return 403; }
location = /university/oid4vc/offer { return 403; }
