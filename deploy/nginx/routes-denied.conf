# Refusals for the public listeners.
#
# Included ONLY by the internet-facing server blocks. Each of these paths sits
# under a wallet-facing prefix, so leaving it out of routes-citizen.conf would
# not be enough — the broader prefix would still serve it. It has to be refused
# explicitly here and proxied for real in routes-ops.conf, which is why the two
# lists live in different files: nginx rejects a duplicate location.
# Keycloak's admin console. The citizen-facing realm endpoints under /auth stay
# public — this longer prefix wins for the console, which would otherwise be
# served by that prefix and answer with a login page.
location /auth/admin      { return 403; }
location = /oid4vc/offer { return 403; }
location = /vp/request   { return 403; }
location /vp/status      { return 403; }
