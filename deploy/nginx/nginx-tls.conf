# The same gateway, over TLS.
#
# Used instead of nginx.conf when HTTPS is enabled (scripts/enable-https.sh and
# docker-compose.tls.yml). Two reasons the demo needs it at all:
#
#   1. `did:web` mandates https. Over plain HTTP the issuer's identifier only
#      resolves for clients told to relax that rule, which a real wallet is
#      entitled not to do.
#   2. A wallet's in-app browser is where the citizen types their password.
#
# The certificate is reached through a STABLE path — /etc/letsencrypt/live/current
# is a symlink enable-https.sh points at the issued hostname — so no hostname is
# baked into this file and a renewal needs no edit here.
server {
    listen 80;
    server_name _;

    # Renewals are served from disk while the stack keeps running; only the
    # first issuance needs the port to itself.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else moves to https, so the origin in issuer metadata, tokens
    # and request objects is the one the wallet actually talks to.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/current/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/current/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/routes-citizen.conf;
    include /etc/nginx/routes-denied.conf;
}

# The operator listener, plain HTTP on 127.0.0.1 only (see docker-compose.yml).
# No certificate is involved because nothing off this machine can reach it, and
# requiring TLS here would mean either a second certificate for `localhost` or
# every setup script passing --insecure.
server {
    listen 8088;
    server_name _;

    include /etc/nginx/routes-citizen.conf;
    include /etc/nginx/routes-ops.conf;
}
