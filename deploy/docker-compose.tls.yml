# HTTPS overlay for the gateway.
#
#   ./scripts/enable-https.sh <hostname>          issues the certificate and
#                                                 restarts the stack with this
#
# Kept as an OVERLAY rather than folded into docker-compose.yml so a local
# checkout still comes up on plain HTTP with no certificate, no hostname and no
# Let's Encrypt account — `docker compose up -d` must keep working offline.
#
# Usage without the script:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
services:
  nginx:
    volumes:
      - ./nginx/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/routes-citizen.conf:/etc/nginx/routes-citizen.conf:ro
      - ./nginx/routes-ops.conf:/etc/nginx/routes-ops.conf:ro
      - ./nginx/routes-trust.conf:/etc/nginx/routes-trust.conf:ro
      - ./nginx/routes-denied.conf:/etc/nginx/routes-denied.conf:ro
      - ../services/verifier-web:/usr/share/nginx/html/verifier:ro
      - ../services/bank-web:/usr/share/nginx/html/bank:ro
      # Iteration 03's two portals. This list REPLACES the base file's rather
      # than adding to it — Compose merges service keys but not sequences — so a
      # mount added to docker-compose.yml and not here is silently absent over
      # HTTPS. That is exactly how /admissions/ and /employer/ 404ed on the demo
      # host while working locally on plain HTTP.
      - ../services/education-web:/usr/share/nginx/html/education:ro
      - ../services/web-assets:/usr/share/nginx/html/assets:ro
      # Read-only: nginx serves the certificate, certbot owns it.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Where certbot drops the challenge file on renewal.
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - '80:80'
      - '443:443'
      # Operator listener, loopback only — see docker-compose.yml.
      - '127.0.0.1:8088:8088'
    # The base healthcheck probes http://127.0.0.1/gateway-health, which this
    # overlay turns into a 301 to https. wget follows it, then fails to verify
    # the certificate — it is issued for the public hostname, not for 127.0.0.1 —
    # and the gateway sits permanently unhealthy while serving traffic perfectly.
    # Anything with `depends_on: nginx: service_healthy` then waits forever.
    #
    # Probe the operator listener instead: same nginx, plain HTTP, no redirect,
    # and loopback-only so it is not a public surface.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8088/gateway-health >/dev/null || exit 1']
